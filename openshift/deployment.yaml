apiVersion: apps/v1
kind: Deployment
metadata:
  name: oc-final-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oc-final-app
  template:
    metadata:
      labels:
        app: oc-final-app
    spec:
      containers:
        - name: app
          image: quay.io/your-org/coursera-cicd-final-project:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
